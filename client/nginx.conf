server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  # In Docker Compose, the backend service is exposed as `api`.
  # If the upstream is temporarily unavailable during container startup,
  # keep nginx from failing hard on config load by resolving via docker DNS.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream http://api:8001;

  # Проксі API-запитів на бекенд
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path / /;
    proxy_cookie_flags ~ secure httponly samesite=lax;
  }

  location /token {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cookie_path / /;
    proxy_cookie_flags ~ secure httponly samesite=lax;
  }

  location / {
    try_files $uri /index.html;
  }
}
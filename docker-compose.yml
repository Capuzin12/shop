services:
  db:
    image: postgres:15-alpine
    # Для базы лучше прописать данные из server/.env, так как они там точно есть
    env_file:
      - ./server/.env
    environment:
      # Мапим переменные из вашего файла (DATABASE_URL там содержит юзера и пароль)
      # Но Postgres нужны конкретные имена:
      POSTGRES_USER: buildshop_user
      POSTGRES_PASSWORD: buildshop_password
      POSTGRES_DB: buildshop_db
    # ... остальные настройки (ports, healthcheck)

  api:
    build:
      context: ./server
    # Указываем путь к серверному .env
    env_file:
      - ./server/.env
    # Переопределяем localhost на db прямо здесь, чтобы не менять файл .env
    environment:
      - DATABASE_URL=postgresql+psycopg://buildshop_user:buildshop_password@db:5432/buildshop_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        # Берем переменные из client/.env и передаем их в Dockerfile фронтенда
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_IMGBB_API_KEY=${VITE_IMGBB_API_KEY}
    # Указываем путь к клиентскому .env для самого процесса сборки
    env_file:
      - ./client/.env
    ports:
      - "80:80"

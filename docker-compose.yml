services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./server/.env
    environment:
      # Важно: используйте значения, которые реально прописаны в вашем .env
      POSTGRES_USER: buildshop_user
      POSTGRES_PASSWORD: buildshop_password
      POSTGRES_DB: buildshop_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildshop_user -d buildshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      # ИСПРАВЛЕНО: меняем localhost на db
      - DATABASE_URL=postgresql+psycopg://buildshop_user:buildshop_password@db:5432/buildshop_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        # Убедитесь, что в ./client/.env VITE_API_BASE_URL=https://onrender.com
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_IMGBB_API_KEY=${VITE_IMGBB_API_KEY}
    env_file:
      - ./client/.env
    ports:
      - "80:80"
